# The length arm, plus a negative control.
#
# WHAT WAS CUT AND WHY (docs/DECISIONS.md D14): the planned task-count arm (2/3/4
# concurrent tasks) is not implementable in this codebase. Task identity IS TaskKind,
# and there are only two distinct kinds, so "3 tasks" resolved to
# [SHOPPING, SCHEDULE, SHOPPING] -- the duplicate merges into the first list's state
# and its turns get emitted twice. The token-match assertion caught it. Supporting a
# real task-count arm needs per-instance identity (two separately named shopping
# lists), which is recorded as next work.
#
# n_ops = 6 is measured, not guessed. `run.py --calibrate` on qwen2.5-coder:7b:
#     n_ops     6     12     18     24
#     blocked  0.62  0.38   0.12   0.00   <-- 24 was the originally planned value
# At the planned value every cell sits on the floor in both orderings and the sweep
# reports "no switch cost" for reasons having nothing to do with switching.

models:
  - qwen2.5-coder:7b
  - gemma4:12b

num_ctx: 16384      # constant across every cell: sizing per-condition would change the
                    # model's setup between cells and invalidate the comparison
n_pairs: 30         # see docs/LIMITATIONS.md §9 on power; 100+ is the paper-grade run
n_false: 2
seed0: 1

cells:
  # --- negative control ---------------------------------------------------------------
  # One task: there is nothing to interleave, so both orderings are the identical
  # sequence and the measured delta MUST be exactly zero. Any non-zero result here
  # would mean the harness manufactures differences on its own.
  - {label: "ctrl_1task",  n_tasks: 1, n_ops: 6, n_noise: 40}
  # --- length arm: 2 tasks, 6 ops, padding varies -------------------------------------
  - {label: "len_short",   n_tasks: 2, n_ops: 6, n_noise: 0}
  - {label: "len_medium",  n_tasks: 2, n_ops: 6, n_noise: 40}   # <-- PRIMARY (pre-registered)
  - {label: "len_long",    n_tasks: 2, n_ops: 6, n_noise: 120}
